  types:
    shop-purchase:  { title: "Purchase Receipt",    subtitle: "PURCHASE RECEIPT",     stamp: "PAID",     color: done }
    auction-buy:    { title: "Purchase Receipt",    subtitle: "PURCHASE RECEIPT",     stamp: "PAID",     color: done }
    auction-won:    { title: "Winning Bid Receipt", subtitle: "WINNING BID RECEIPT",  stamp: "PAID",     color: done }
    auction-sold:   { title: "Sales Receipt",       subtitle: "SALES RECEIPT",        stamp: "SOLD",     color: done }
    auction-listed: { title: "Listing Confirmed",   subtitle: "LISTING CONFIRMATION", stamp: "LISTED",   color: listed }
    auction-outbid: { title: "Outbid Notice",       subtitle: "OUTBID NOTICE",        stamp: "OUTBID",   color: outbid }
    auction-expired: { title: "Auction Ended",      subtitle: "AUCTION ENDED",        stamp: "EXPIRED",  color: expired }
    auction-removed: { title: "Listing Removed",    subtitle: "LISTING REMOVED",      stamp: "REMOVED",  color: removed }
    penalty:        { title: "Payment Default",     subtitle: "PAYMENT DEFAULT",      stamp: "DEFAULT",  color: penalty }
    combined:       { title: "Combined Statement",  subtitle: "COMBINED STATEMENT",   stamp: "MERGED",   color: summary }
    daily:          { title: "Daily Summary",       subtitle: "DAILY SUMMARY",        stamp: "SETTLED",  color: summary }
  notes:
    claim-box: "Items were placed in your claim box: /mart → Auction → Claim box."
    to-inventory: "Items were put straight into your inventory."
    paid-from: "Payment was taken from your {currency} account."
    paid-on-win: "The winning bid and tax were taken from your {currency} account when the hammer fell."
    deposited: "Payment went straight into your {currency} account; the buyer paid the tax separately."
    returned: "Items were returned to your claim box; claim them to list again."
    no-bids: "Nobody bid during the auction."
    unpaid: "None of the bidders could pay, so the auction ended without a sale."
    expired-fixed: "Nobody bought it before it expired."
    forced: "An admin removed this auction. No bidder was charged."
    cancelled: "You removed this listing yourself."
    contact-admin: "Contact a server admin if you have questions."
    expire-return: "If it does not sell before it expires, the items go back to your claim box."
    cancel-hint: "You can remove it early in /mart → Auction → My listings (not once a bid has been placed)."
    knock-rule: "After the end time the hammer knocks every {minutes} min; the sale closes on knock {count}. A new bid restarts the count."
    outbid: "Your bid was outbid. Nothing was charged when you bid, so there is nothing to refund."
    rebid: "To keep bidding, go to /mart → Auction → Market and bid again."
    penalty-ban: "You cannot buy, bid or list on AetherMart until {until}."
    penalty-debt: "The unpaid part of the fine is recorded as debt. You cannot trade on AetherMart until it is paid (it is taken automatically at your next trade)."
    penalty-next: "The auction went to the next bidder."
    daily-empty: "There were no trades in this period."
