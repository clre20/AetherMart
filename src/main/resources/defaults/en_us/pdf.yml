# AetherMart PDF settings
# Every text printed on the PDFs lives here; missing keys are added automatically on start and /mart reload
pdf-version: 1
# Language of this file; when config.yml changes language, this file is backed up and rebuilt
language: en_us

# Header
server-name: "My Server"
subtitle: "AetherMart Trading System"

# Fonts: leave empty = bundled Noto Sans TC / SC (Traditional Chinese, Simplified Chinese and English all display)
# To use another font, put the TTF in plugins/AetherMart/fonts/ and enter the file name (.ttf only)
font:
  regular: ""
  bold: ""

colors:
  theme: "#1F5F6B"        # header band, headings
  stamp:
    done: "#C0392B"       # completed (vermilion)
    listed: "#1D4ED8"     # on auction (blue)
    outbid: "#7E22CE"     # outbid (purple)
    expired: "#6B7280"    # expired (grey)
    removed: "#C2410C"    # removed (orange)
    penalty: "#991B1B"    # default (dark red)
    summary: "#1F5F6B"    # combined / settled (teal)

text:
  generated: "Generated {time}"
  footer: "This statement was generated automatically by AetherMart for your records"
  page: "Page {page} / {pages}"
  continued: "{title} (continued)"
  sections:
    items: "Items"
    returned-items: "Returned items"
    auction-items: "Auction items"
    amount: "Amount"
    notes: "Notes"
    summary: "Summary"
    by-currency: "Totals by currency"
    overview: "Currency overview"
    by-type: "By type"
    top: "Top 10 sales"
    all: "All trades"
  columns:
    index: "#"
    item: "Item"
    amount: "Qty"
    remark: "Enchantments & durability"
    time: "Time"
    type: "Type"
    auction: "Auction"
    money: "Amount"
    currency: "Currency"
    spent: "Spent"
    received: "Received"
    net: "Net"
    count: "Count"
    buyer: "Buyer"
    seller: "Seller"
    goods: "Items"
  fields:
    id: "Statement no."
    time: "Date"
    type: "Type"
    auction-id: "Auction no."
    category: "Category"
    buyer: "Buyer"
    seller: "Seller"
    currency: "Currency"
    count: "Items"
    unit: "Unit"
    listed-at: "Listed"
    ends-at: "Ends"
    ended-at: "Ended"
    won-at: "Won"
    winner: "Winner"
    bidder: "Bidder"
    bids: "Bids"
    bidders: "Bidders"
    handler: "Handled by"
    mode: "Mode"
    remaining: "Time left"
    duration: "Duration"
    player: "Player"
    period: "Period"
    records: "Records"
    reason: "Reason"
    pages: "Following pages"
    settled-at: "Settled"
    timezone: "Time zone"
    trade-count: "Trades"
    players: "Players"
    ban-until: "Banned until"
  values:
    system-shop: "System shop"
    items-count: "{slots} slots, {amount} items"
    unit-count: "{unit} per unit"
    bids: "{count} ({people} bidders)"
    people: "{count}"
    none: "—"
    peak: "Peak hours: notices were combined"
    daily-receipts: "Daily receipts, sent once at the settlement time"
    first-pages: "First {shown} records get a page; the rest are listed in the summary"
    each-page: "One page per record"
    records: "{count}"
    pieces: "{count} pcs"
  modes:
    fixed: "Buy now"
    bid: "Auction"
  trade-types:
    shop-buy: "System shop purchase"
    auction-buy: "Auction purchase (buy now)"
    auction-won: "Auction won (bidding)"
    sold-fixed: "Auction sold (buy now)"
    sold-bid: "Auction sold (bidding)"
    listed-fixed: "Listed (buy now)"
    listed-bid: "Listed (bidding)"
    outbid: "Outbid"
    expired-fixed: "Expired unsold (buy now)"
    expired-bid: "Auction ended without sale"
    expired-unpaid: "Ended (no winner could pay)"
    cancelled: "Removed by seller"
    force-removed: "Removed by admin"
    penalty: "Unpaid winning bid"
    list: "Listed"
    bid: "Bid"
    sale: "Sale (buy now)"
