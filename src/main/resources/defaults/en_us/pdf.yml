    quantity: "Quantity"
    subtotal: "Subtotal"
    tax: "Tax ({percent}%)"
    balance-after: "Balance after payment"
    paid: "Total paid"
    price: "Price"
    sale-price: "Sale price"
    received: "Amount received"
    expected: "Expected income"
    buyer-tax: "Tax paid by buyer ({percent}%)"
    start-price: "Starting price"
    win-price: "Winning bid"
