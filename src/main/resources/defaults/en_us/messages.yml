discord:
  footer: "{server} · AetherMart"
  dm:
    shop-purchase:
      title: "Purchase complete"
      description: "You bought **{item} x{amount}** from the system shop for **{price}**.\nStatement: {receipt}"
    auction-buy:
      title: "Auction purchase complete"
      description: "You bought {seller}'s auction #A-{id} for **{price}**.\nItems: {items}\nThe items are in your claim box. Statement: {receipt}"
    won:
      title: "You won the auction"
      description: "You won {seller}'s auction #A-{id}; **{price}** was charged.\nItems: {items}\nThe items are in your claim box. Statement: {receipt}"
    sold:
      title: "Auction sold"
      description: "Your auction #A-{id} was bought by {buyer}; you received **{price}**.\nItems: {items}\nStatement: {receipt}"
    listed:
      title: "Listing confirmed"
      description: "Auction #A-{id} ({mode}) is listed at **{price}**, ending {ends}.\nItems: {items}\nStatement: {receipt}"
    cancelled:
      title: "Listing removed"
      description: "You removed auction #A-{id}; the items are back in your claim box.\nItems: {items}\nStatement: {receipt}"
    force-removed:
      title: "Auction removed by an admin"
      description: "Your auction #A-{id} was removed by admin {admin}; the items are back in your claim box.\nItems: {items}\nStatement: {receipt}"
    expired:
      title: "Auction ended without a sale"
      description: "Your auction #A-{id} didn't sell; the items are back in your claim box.\nItems: {items}\nStatement: {receipt}"
    outbid:
      title: "You were outbid"
      description: "Your bid on auction #A-{id} was outbid. Highest is now **{price}**; the next minimum bid is {min}.\nItems: {items}"
    penalty:
      title: "Unpaid winning bid (default)"
      description: "When auction #A-{id} closed, your balance couldn't cover {price}.\nFine **{fine}**, debt **{debt}**, banned from trading until {until}.\nStatement: {receipt}"
    combined:
      title: "Trade notices ({count})"
      description: "Peak trading hours: notices for {player} were combined:\n{lines}"
      line: "• {title}"
  admin:
    shop-purchase:
      title: "System shop purchase"
      description: "{player} bought {item} x{amount} for {price}"
    sale:
      title: "Auction sale"
      description: "#A-{id} ({mode}) {seller} → {buyer}, sold for {price}, tax {tax}\nItems: {items}"
    force-removed:
      title: "Force removed"
      description: "{admin} removed {seller}'s auction #A-{id}\nItems: {items}"
    penalty:
      title: "Unpaid winning bid"
      description: "{player} didn't pay for auction #A-{id} ({price}). Fine {fine}, debt {debt}, banned until {until}"
    paused:
      title: "Auction market closed"
      description: "{admin} closed the auction market"
    resumed:
      title: "Auction market opened"
      description: "{admin} opened the auction market"
    combined:
      title: "Trade log ({count} entries)"
      description: "{lines}"
