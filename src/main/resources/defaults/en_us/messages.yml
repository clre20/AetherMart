  hour: "h"
  minute: "m"
  second: "s"

item:
  durability: "Durability"

currency:
  unavailable: "&c{currency} is unavailable right now; related trades are paused."

input:
  hint: "&7Type in chat; type \"&f{cancel}&7\" to cancel (cancels automatically after {seconds} s)."
  timeout: "&7Input timed out; back to the menu."
  cancelled: "&7Input cancelled."

link:
