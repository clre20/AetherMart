# AetherMart messages
# Supports & colour codes and &#RRGGBB; {variables} are replaced automatically. Missing keys are added on start and /mart reload.
messages-version: 3
# Language of this file; when config.yml changes language, this file is backed up and rebuilt
language: en_us

common:
  no-permission: "&cYou don't have permission."
  loading: "&7Loading data, please try again in a moment."
  loading-short: "Loading…"
  not-enough: "&cNot enough money. You need &e{amount}&c."
  bad-amount: "&cInvalid amount (positive number, up to {decimals} decimal places)."
  unknown-player: "&cPlayer {player} not found (they must have joined the server before)."

startup:
  settle-retry:
    - "Auction #A-{id}: the economy plugin failed during settlement: {error} (try {tries})"
    - "This does not count as the winner failing to pay, so nobody is penalised; it retries in 5 minutes. If it keeps failing, force-remove it with /mart admin auction (items go back to the seller, nobody is charged)."
  no-vault:
    - "=============================================="
    - "AetherMart cannot start: Vault is not installed."
    - "A currency in config.yml uses Vault (type: vault), which needs two plugins:"
    - "  1. Vault (https://github.com/MilkBowl/Vault/releases)"
    - "  2. An economy plugin that supports Vault, such as TheosisEconomy or EssentialsX"
    - "Put them in plugins/ and restart the server."
    - "To use only ExcellentEconomy, set every currency in currencies to type: excellenteconomy."
    - "=============================================="
  currency-no-vault: "Currency \"{currency}\" ({id}) is unavailable: Vault is not installed. Products and auctions priced in it are paused."
  currency-no-economy:
    - "Currency \"{currency}\" ({id}) is unavailable: Vault is installed, but no economy plugin is registered with it."
    - "Install an economy plugin that supports Vault (such as TheosisEconomy or EssentialsX). Until then, products and auctions priced in it are paused."
  currency-no-excellent:
    - "Currency \"{currency}\" ({id}) is unavailable: ExcellentEconomy is missing, or the currency ID in config.yml does not exist."
    - "Check that ExcellentEconomy is installed and that currencies.{id}.id matches an ExcellentEconomy currency ID. Until then, related trades are paused."

reason:
  no-permission: "No permission"
  loading: "Loading your data, please wait"
  banned: "Unpaid winning bid: banned from trading until {until}"
  debt: "Debt {debt}; your balance can't cover it"
  link-required: "Discord not linked (use /dclink link)"
  link-unavailable: "Can't check your Discord link right now"
  currency-unavailable: "{currency} is unavailable right now"
  not-enough: "Not enough money: need {amount}, you have {balance}"
  shop-gone: "This product no longer exists"
  shop-limit: "Over the purchase limit: {left} left this period"
  no-space: "Not enough inventory space"
  paused: "The auction market is closed"
  no-items: "No items added yet"
  banned-item: "{item} can't be sold"
  bad-currency: "This currency can't be used for auctions"
  no-price: "Price not set"
  price-range: "The price must be between {min} and {max}"
  duration-range: "The duration must be between {min} and {max}"
  listing-limit: "Listing limit reached ({limit})"
  category-gone: "The category was deleted"
  below-min: "Price is below the minimum {min}"
  no-end: "End time not set"
  no-discount: "Discount not set"
  end-before-start: "The end time must be after the start time"
  end-past: "The end time has already passed"
  overlap: "Overlaps another promotion ({start} to {end})"
  too-many: "Promotion limit reached"

time:
