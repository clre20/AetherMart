# AetherMart 訊息文字
# 支援 & 色碼與 &#RRGGBB；{變數} 會自動取代。啟動與 /mart reload 時自動補齊缺少的項目。
messages-version: 1
# 這個檔案的語言；config.yml 換語言時，此檔會備份並以新語言重建
language: zh_tw

common:
  no-permission: "&c你沒有權限。"
  loading: "&7資料載入中，請稍後再試。"
  loading-short: "載入中…"
