# AetherMart PDF 設定
# PDF 上所有文字都在這裡；啟動與 /mart reload 時自動補齊缺少的項目
pdf-version: 1
# 這個檔案的語言；config.yml 換語言時，此檔會備份並以新語言重建
language: zh_tw

# 頁首
server-name: "我的伺服器"
subtitle: "AetherMart 交易系統"

# 字型：留空 = 內建 Noto Sans TC／SC（繁中、簡中、英文都能顯示）
# 要換字型請把 TTF 放進 plugins/AetherMart/fonts/ 並填檔名（只接受 .ttf）
font:
  regular: ""
  bold: ""

colors:
  theme: "#1F5F6B"        # 頁首色帶、標題
  stamp:
    done: "#C0392B"       # 已成交（朱紅）
    listed: "#1D4ED8"     # 拍賣中（藍）
    outbid: "#7E22CE"     # 已被超越（紫）
    expired: "#6B7280"    # 已流標（灰）
    removed: "#C2410C"    # 已下架（橘）
    penalty: "#991B1B"    # 違約（深紅）
    summary: "#1F5F6B"    # 已彙總／已結算（深青）

