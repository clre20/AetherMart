# AetherMart PDF 设置
# PDF 上所有文字都在这里；启动与 /mart reload 时自动补齐缺少的项目
pdf-version: 1
# 这个文件的语言；config.yml 换语言时，此文件会备份并以新语言重建
language: zh_cn

# 页首
server-name: "我的服务器"
subtitle: "AetherMart 交易系统"

# 字体：留空 = 内建 Noto Sans TC／SC（繁中、简中、英文都能显示）
# 要换字体请把 TTF 放进 plugins/AetherMart/fonts/ 并填文件名（只接受 .ttf）
font:
  regular: ""
  bold: ""

colors:
  theme: "#1F5F6B"        # 页首色带、标题
  stamp:
    done: "#C0392B"       # 已成交（朱红）
    listed: "#1D4ED8"     # 拍卖中（蓝）
    outbid: "#7E22CE"     # 已被超越（紫）
    expired: "#6B7280"    # 已流标（灰）
    removed: "#C2410C"    # 已下架（橘）
    penalty: "#991B1B"    # 违约（深红）
    summary: "#1F5F6B"    # 已汇总／已结算（深青）

text:
  generated: "产生时间 {time}"
  footer: "本明细由 AetherMart 自动产生，仅供交易纪录参考"
  page: "第 {page}／{pages} 页"
  continued: "{title}（续）"
  sections:
    items: "物品明细"
    returned-items: "退回物品"
    auction-items: "拍卖物品"
    amount: "金额"
    notes: "备注"
